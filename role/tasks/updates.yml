---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist

# Package upgrades can restart nfs-server, which can leave new mounts failing
# with "Stale file handle"
- name: Flush NFS export cache
  ansible.builtin.command:
    cmd: exportfs -f
  changed_when: false

- name: Verify a new NFS mount succeeds
  ansible.builtin.shell: |
    set -u
    mnt=$(mktemp -d)
    trap 'umount "$mnt" 2>/dev/null; rmdir "$mnt"' EXIT
    for ip in $(hostname -I); do
      case "$ip" in *:*) continue ;; esac
      if out=$(timeout 30 mount -t nfs4 -o ro,soft,timeo=50,retrans=1 "$ip:{{ nfs_exports[0].path }}" "$mnt" 2>&1); then
        echo "mounted via $ip"
        exit 0
      fi
      case "$out" in *"Stale file handle"*) echo "$out" >&2; exit 1 ;; esac
    done
    echo "skipped: no local address is allowed by the export"
  args:
    executable: /bin/bash
  register: nfs_mount_check
  changed_when: false
  when: nfs_exports | length > 0

- name: Show NFS mount check result
  ansible.builtin.debug:
    msg: "{{ nfs_mount_check.stdout }}"
  when: nfs_exports | length > 0

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Notify if reboot is required
  ansible.builtin.debug:
    msg: "REBOOT REQUIRED — a kernel or core library was updated. Reboot the server when ready."
  when: reboot_required.stat.exists
