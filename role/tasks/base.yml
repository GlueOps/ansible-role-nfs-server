---
# Extra packages
- name: Install extra packages
  ansible.builtin.apt:
    name: "{{ nfs_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: nfs_extra_packages | length > 0

# Firewall
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Set ufw default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set ufw default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: "SSH"

- name: Allow NFSv4 from trusted subnets
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "NFSv4 from {{ item }}"
  loop: "{{ nfs_allowed_subnets }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    logging: "on"

# SSH hardening
- name: Ensure sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

# /etc/ssh/sshd_config on Ubuntu 24.04 begins with
# `Include /etc/ssh/sshd_config.d/*.conf`, and sshd takes the FIRST value it
# obtains for a keyword. Editing the main file therefore loses to any drop-in --
# cloud images ship 50-cloud-init.conf, which commonly sets
# `PasswordAuthentication yes`. The 00- prefix is load-bearing: included files
# are read in lexical order, so a 99- file would lose to 50-cloud-init.conf.
- name: Deploy SSH hardening drop-in
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      # Managed by Ansible -- do not edit
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: "0644"
    validate: 'sshd -t -f %s'
  notify: restart sshd

# `validate` above only proves the snippet parses; it cannot prove our values
# survived the merge. Asserting on the effective config is what turns a silent
# shadowing regression into a loud failure.
- name: Read effective SSH configuration
  ansible.builtin.command:
    cmd: sshd -T
  changed_when: false
  register: nfs_sshd_effective

- name: Assert SSH hardening actually took effect
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in (nfs_sshd_effective.stdout | lower)"
      - "'kbdinteractiveauthentication no' in (nfs_sshd_effective.stdout | lower)"
      - "'permitrootlogin yes' not in (nfs_sshd_effective.stdout | lower)"
    fail_msg: >-
      sshd -T shows hardening did not take effect. A drop-in in
      /etc/ssh/sshd_config.d/ that sorts before 00-hardening.conf is
      overriding it.
    quiet: true

- name: Lock root password
  ansible.builtin.user:
    name: root
    password_lock: true
