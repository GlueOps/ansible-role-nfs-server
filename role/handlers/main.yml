---
- name: reload exports
  ansible.builtin.command:
    cmd: exportfs -ra
  register: nfs_exportfs
  changed_when: true
  # exportfs frequently exits 0 while reporting per-line parse errors on stderr,
  # so rc alone is not enough to know the export table actually applied.
  failed_when: nfs_exportfs.rc != 0 or 'exportfs:' in (nfs_exportfs.stderr | default(''))

- name: restart nfs
  ansible.builtin.shell: |
    set -e
    systemctl daemon-reload
    systemctl stop nfs-server || true
    systemctl start nfs-server
  changed_when: false

- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted
