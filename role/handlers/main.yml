---
- name: reload exports
  ansible.builtin.command:
    cmd: exportfs -ra
  register: nfs_exportfs
  changed_when: true
  # exportfs frequently exits 0 while reporting per-line errors on stderr, so rc
  # alone is not enough to know the export table actually applied. Match only
  # genuine errors: matching every "exportfs:" line would also trip on the
  # non-fatal "Neither 'subtree_check' or 'no_subtree_check' specified ...
  # Assuming default behaviour" warning, which is emitted for any export that
  # omits the subtree directive and must not fail the run.
  failed_when: >-
    nfs_exportfs.rc != 0 or
    (nfs_exportfs.stderr | default('')) is search('Invalid|does not support NFS export|requires fsid=|bad anon(uid|gid)|duplicated export entries')

- name: restart nfs
  # try-restart on nfs-mountd is explicit rather than relying on it being
  # dragged along by nfs-server: whether stopping nfs-server also stops mountd
  # depends on unit-file details that have changed between nfs-utils releases,
  # and [mountd] threads only takes effect on a real mountd restart. try-restart
  # is a no-op if the unit is not running.
  ansible.builtin.shell: |
    set -e
    systemctl daemon-reload
    systemctl stop nfs-server || true
    systemctl start nfs-server
    systemctl try-restart nfs-mountd
  changed_when: false

- name: reload sysctl
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: restart sshd
  ansible.builtin.systemd:
    name: ssh
    state: restarted
